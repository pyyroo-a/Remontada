[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remontada"
version = "0.1.0"
description = "Team Remontada's frame-level possession pipeline for More than a Hack 2027"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"remontada.vendor" = ["*.csv", "LICENSE-mtah2027", "README.md"]
"remontada.config" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Short tracebacks always, and never replay what a failed test printed: either could show match
# data from a failed real-data test.
addopts = "--tb=line --show-capture=no"
markers = ["realdata: needs the licensed match data or the IDSSE download; asserts summary numbers only"]
